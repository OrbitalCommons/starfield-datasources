name: CI

on:
  push:
    branches: ["main", "meawoppl/**"]
  pull_request:
    branches: ["main", "meawoppl/**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-features

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Clippy
        run: |
          cargo clippy --workspace --all-features -- -D warnings
          cargo clippy -p starfield-datasource-utils -p starfield-gaia -p starfield-hipparcos -p starfield-mast -p starfield-planet-maps -p starfield-planet-spectra -p starfield-datasources --all-targets --all-features -- -D warnings

      - name: Check minimal facade
        run: cargo check -p starfield-datasources --no-default-features

      - name: Check build input scripts
        run: python3 -m py_compile crates/reflectance-library/scripts/build_table.py crates/solar-spectrum/scripts/build_table.py

      - name: Check formatting
        run: cargo fmt --all -- --check

  url-verification:
    name: Verify Broker URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify all broker URLs resolve
        run: cargo test -p starfield-rubin --test url_verification -- --ignored
